services:
  app:
    image: ${GENEALOGY_IMAGE:-ghcr.io/jeege/genealogy:latest}
    build:
      context: .
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-3000}:8080"
    environment:
      API_HOST: 0.0.0.0
      API_PORT: "8080"
      DATABASE_URL: ${DATABASE_URL:?请配置 PostgreSQL 连接字符串 DATABASE_URL}
      APP_ORIGIN: ${SITE_URL:?请配置站点公开地址 SITE_URL}
      FAMILY_SURNAME: ${FAMILY_SURNAME:-刘}
      SESSION_TTL: ${SESSION_TTL:-720h}
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-false}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # 成员照片：容器内路径固定，宿主机通过 volumes 持久化。
      PHOTO_STORAGE_DIR: /data/photos
      PHOTO_MAX_BYTES: ${PHOTO_MAX_BYTES:-10485760}
      PHOTO_THUMBNAIL_MAX_EDGE: ${PHOTO_THUMBNAIL_MAX_EDGE:-480}
    volumes:
      - photo-data:/data/photos
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "genealogy-server", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-genealogy}
      POSTGRES_USER: ${POSTGRES_USER:-genealogy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请配置数据库密码 POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 10
    restart: unless-stopped

volumes:
  db-data:
  photo-data:
