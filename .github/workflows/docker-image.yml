name: 发布 Docker 镜像到 GHCR

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/instructions/**'
      - '.github/prompts/**'
  workflow_dispatch:
    inputs:
      version:
        description: 可选的版本标签（例如 2026.10.26）；留空则使用分支/提交信息
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: backend/go.sum

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      # scripts/go.mjs 默认使用仓库内 .cache；CI 中改用 setup-go 已缓存的目录。
      - name: 使用 Go 默认缓存目录
        run: |
          echo "GOCACHE=$(go env GOCACHE)" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$(go env GOMODCACHE)" >> "$GITHUB_ENV"

      - name: 运行 Node 与 Go 测试
        run: npm test

      - name: 类型检查
        run: npx tsc --noEmit

      # 提前校验静态导出与 Go 单二进制构建链路，避免镜像构建才发现问题。
      - name: 校验静态导出与单二进制
        run: npm run build && cd backend && go build -o /tmp/genealogy-server ./cmd/server

      # Docker 镜像名必须全小写；含大写字母的仓库名在这里统一规范化。
      - name: 计算镜像名
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: 设置 QEMU（跨架构构建）
        uses: docker/setup-qemu-action@v3

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 生成标签与 OCI 元数据：分支、语义化版本、commit sha 与 latest（默认分支）。
      - name: 生成镜像元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.version != '' }}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=pure-genealogy
            org.opencontainers.image.description=Chinese family genealogy app (React SPA embedded in Go)
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: 输出镜像信息
        run: |
          echo "已推送以下标签："
          echo "${{ steps.meta.outputs.tags }}"
